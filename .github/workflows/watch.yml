name: flight-watch

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub may start runs late)
  workflow_dispatch:
    inputs:
      summary:
        description: "Send the overview message"
        type: boolean
        default: false

concurrency:
  group: flight-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore price state
        uses: actions/cache/restore@v4
        with:
          path: prices.db
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Check fares
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Amsterdam
        run: python flight_watch.py ${{ inputs.summary && '--summary' || '' }}
      - name: Save price state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: prices.db
          key: prices-${{ github.run_id }}
